<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支出憑證黏存單 產生工具</title>
    <script src="docxtemplater.js"></script>
    <script src="pizzip.js"></script>
    <script src="FileSaver.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #45a049; }
        /* 新增：單一項目輸入框與清除按鈕的排版 */
        .input-wrapper { display: flex; gap: 8px; align-items: center; }
        .input-wrapper input { flex: 1; }
        .btn-clear { width: auto; padding: 10px 15px; background-color: #95a5a6; margin-top: 0; }
        .btn-clear:hover { background-color: #7f8c8d; }

        /* 新增：最下方「產生/全部清除」動作按鈕群組排版 */
        .action-group { display: flex; gap: 10px; margin-top: 15px; }
        .action-group button { margin-top: 0; }
        .btn-generate { background-color: #1B5EBE; } /* 微軟 Word 官方藍色 */
        .btn-generate:hover { background-color: #103F91; } /* 微軟 Word 官方深藍色 */
        .btn-clear-all { background-color: #e74c3c; } /* 紅色 */
        .btn-clear-all:hover { background-color: #c0392b; }
        .instructions { background: #e9f5f9; padding: 15px; border-left: 4px solid #3498db; margin-bottom: 20px; font-size: 14px; color: #333; line-height: 1.6; }
        /* 新增：手機版自適應專用樣式 */
        @media (max-width: 480px) {
            .container { padding: 15px; }
            .input-wrapper { flex-direction: column; align-items: stretch; }
            .btn-clear { width: 100%; margin-top: 5px; }
            .action-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>支出憑證黏存單 填表工具</h2>
        <div class="instructions">
            <strong>【台大醫院版本】</strong><br>
            只要在下方填寫資料，系統會自動套入標準格式，並匯出填妥的 Word 檔案。<br>
            所有資料均在您本機瀏覽器上生成，不會有任何資料上傳雲端，請安心使用。
        </div>
        <div class="form-group">
            <label for="projectName">1. 會計科目及計畫名稱</label>
            <div class="input-wrapper">
                <input type="text" id="projectName" placeholder="例如：115-AT9487 / 人類補完計畫">
                <button type="button" class="btn-clear" onclick="clearInput('projectName')">清除</button>
            </div>
        </div>
        <div class="form-group">
            <label for="amount">2. 金額</label>
            <div class="input-wrapper">
                <input type="number" id="amount" placeholder="例如：9487">
                <button type="button" class="btn-clear" onclick="clearInput('amount')">清除</button>
            </div>
        </div>
        <div class="form-group">
            <label for="purpose">3. 用途摘要</label>
            <div class="input-wrapper">
                <input type="text" id="purpose" list="purposeOptions" placeholder="請輸入或從下拉選單選擇 (例如：研究用耗材)" autocomplete="off">
                <button type="button" class="btn-clear" onclick="clearInput('purpose')">清除</button>
            </div>
            <datalist id="purposeOptions">
                <option value="研究用耗材">
                <option value="研究用儀器">
                <option value="實驗委外服務">
                <option value="論文編修">
                <option value="文具用品">
            </datalist>
        </div>
        <div class="form-group">
            <label for="payee">4. 受款人（院內員工請加註電腦代號）</label>
            <div class="input-wrapper">
                <input type="text" id="payee" list="payeeOptions" placeholder="請輸入或從下拉選單選擇 (例如：如發票)" autocomplete="off">
                <button type="button" class="btn-clear" onclick="clearInput('payee')">清除</button>
            </div>
            <datalist id="payeeOptions">
                <option value="如發票">
            </datalist>
        </div>

        <div class="action-group">
            <button type="button" class="btn-generate" onclick="generateDoc()">匯出 Word 表單 (.docx)</button>
            <button type="button" class="btn-clear-all" onclick="clearAll()">全部清除</button>
        </div>
    </div>

        function base64ToUint8Array(base64) {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes;
        }

        function clearInput(id) {
            document.getElementById(id).value = '';
        }

        function clearAll() {
            if (confirm('確定要清除所有填寫的資料嗎？')) {
                document.getElementById("projectName").value = '';
                document.getElementById("amount").value = '';
                document.getElementById("purpose").value = '';
                document.getElementById("payee").value = '';
            }
        }

        function generateDoc() {
            const projectName = document.getElementById("projectName").value;
            const amountInput = document.getElementById("amount").value;
            const purpose = document.getElementById("purpose").value;
            const payee = document.getElementById("payee").value;

            // 1. 判斷是否「完全沒有填寫資訊」
            const isAllEmpty = !projectName && !amountInput && !purpose && !payee;

            // 2. 如果不是全空，但有部分未填，則中斷並提醒
            if (!isAllEmpty && (!projectName || !amountInput || !purpose || !payee)) {
                alert("請填寫所有欄位資料！（若要產生空白表單，請清除所有欄位）");
                return;
            }

            let amountStr = "";
            let paddedAmount = "        "; // 8個空格，用於空白表單分割

            // 3. 若有填寫資料，則處理金額格式
            if (!isAllEmpty) {
                const amount = parseInt(amountInput, 10);
                if (amount < 0 || amount > 99999999) {
                    alert("金額必須在 0 到 99,999,999 之間！");
                    return;
                }
                amountStr = amount.toString();
                // 補足 8 位數 (千萬、百萬、十萬、萬、千、百、十、元)
                paddedAmount = amountStr.padStart(8, '0');
            }

            // 4. 準備寫入 Word 的資料 (使用 trim() 去除空白表單的空格)
            const data = {
                project_name: projectName || "",
                m_10m: paddedAmount[0].trim(),
                m_1m: paddedAmount[1].trim(),
                m_100k: paddedAmount[2].trim(),
                m_10k: paddedAmount[3].trim(),
                m_1k: paddedAmount[4].trim(),
                m_100: paddedAmount[5].trim(),
                m_10: paddedAmount[6].trim(),
                m_1: paddedAmount[7].trim(),
                total_amount: amountStr,
                purpose: purpose || "",
                payee: payee || ""
            };

            try {
                const templateBytes = base64ToUint8Array(base64Template);
                const zip = new PizZip(templateBytes);
                
                const doc = new window.docxtemplater(zip, { 
                    paragraphLoop: true, 
                    linebreaks: true,
                    delimiters: { start: '{{', end: '}}' }
                });
                
                doc.setData(data);
                doc.render();

                const out = doc.getZip().generate({
                 type: "blob",
                 mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                 compression: "DEFLATE" // 加入此行，明確啟用標準 ZIP 壓縮
                });
                // 決定輸出的檔名
                let fileName = "支出憑證黏存單_空白.docx";

                if (!isAllEmpty) {
                    // 取得本機時間
                    const now = new Date();
                    const yyyy = now.getFullYear();
                    // 月份從 0 開始，所以要 +1，並用 padStart 補零至兩位數
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    const dd = String(now.getDate()).padStart(2, '0');
                    const hh = String(now.getHours()).padStart(2, '0');
                    const min = String(now.getMinutes()).padStart(2, '0');

                    // 組合檔名 例如：支出憑證黏存單_20260918_1020.docx
                    fileName = `支出憑證黏存單_${yyyy}${mm}${dd}_${hh}${min}.docx`;
                }

                saveAs(out, fileName);
            } catch (error) {
                console.error("Docxtemplater Error:", error);
                if (error.properties && error.properties.errors) {
                    const errorMessages = error.properties.errors.map(function (e) {
                        return e.properties.explanation;
                    }).join("\n");
                    alert("產生文件時發生錯誤：\n" + errorMessages);
                } else {
                    alert("產生文件時發生未知的格式錯誤！請檢查主控台。");
                }
            }
        }
    </script>
